name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=vue-dark&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=vue-dark&hide_border=true&hide=html,css,scss&exclude_repo=dump_luckin,wechatpay-cli,meituan
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          commit_message="chore: update README cards"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "${commit_message}"

          while [ "$(git log --format=%s -n 2 | tail -n 1)" = "${commit_message}" ]; do
            git reset --soft HEAD~2
            git commit -m "${commit_message}"
          done

          git push --force-with-lease origin HEAD:"${GITHUB_REF_NAME}"
